<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Make Sure Your Vote Counts in STATENAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     STATE THEME — swap these per state if you want a different
     look (each state's flag/colors are a natural starting point).
     Keep the variable NAMES the same; only change the hex values.
     ============================================================ */
  :root{
    --pine:#1F4E3D;
    --pine-dark:#123024;
    --birch:#FBF7ED;
    --birch-card:#FFFFFF;
    --blaze:#E8A33D;
    --blaze-dark:#8A5710;
    --rust:#B5502E;
    --ink:#1C2620;
    --slate:#5B6B62;
    --line:#DDD5C2;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--birch);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:19px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--pine);}
  .wrap{max-width:640px;margin:0 auto;padding:0 0 4rem;}

  header.top{
    background:var(--pine);
    color:#F5F1E4;
    padding:1.6rem 1.25rem 1.9rem;
    border-bottom:6px solid var(--blaze);
    position:relative;
  }
  header.top .headtext{
    max-width:calc(100% - 108px);
  }
  .cornerstack{
    position:absolute;
    top:1.2rem;
    right:1.1rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.5rem;
  }
  .cornerstack .moose{
    width:82px;
    height:69px;
    display:block;
  }
  header.top .eyebrow{
    font-size:.85rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--blaze);
    font-weight:700;
    margin:0 0 .35rem;
  }
  header.top h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:1.8rem;
    line-height:1.14;
    margin:0 0 .6rem;
  }
  header.top p{
    margin:0;
    font-size:1.05rem;
    color:#E4DEC9;
    max-width:34ch;
  }

  .datebadge{
    background:var(--blaze);
    border-radius:12px;
    padding:.5rem .65rem;
    text-align:center;
    box-shadow:0 4px 0 rgba(0,0,0,0.08);
    min-width:74px;
  }
  .datebadge .label{
    font-size:.6rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--blaze-dark);
    margin:0 0 .2rem;
  }
  .datebadge .when{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:.95rem;
    line-height:1.15;
    color:#3A2205;
    margin:0;
  }

  nav.pills{
    display:flex;
    flex-wrap:wrap;
    gap:.55rem;
    padding:1.2rem 1rem 1.2rem;
    justify-content:center;
  }
  nav.pills button{
    flex:0 0 auto;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:.88rem;
    white-space:nowrap;
    color:var(--pine);
    background:#fff;
    border:2px solid var(--line);
    border-radius:999px;
    padding:.55rem 1rem;
    cursor:pointer;
  }
  nav.pills button.active{
    background:var(--pine);
    border-color:var(--pine);
    color:#F5F1E4;
  }

  .group{padding:0 1rem;margin-bottom:1.6rem;}
  .group h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.15rem;
    color:var(--pine);
    margin:0 0 .7rem;
    padding-left:.15rem;
  }

  .item{
    background:var(--birch-card);
    border:2px solid var(--line);
    border-left:8px solid var(--pine);
    border-radius:12px;
    margin-bottom:.85rem;
    overflow:hidden;
  }
  .item.open{border-left-color:var(--blaze);}

  button.q{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:1.05rem 1rem;
    display:flex;
    align-items:center;
    gap:.8rem;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button.q .qtext{
    flex:1;
    font-size:1.15rem;
    font-weight:700;
    color:var(--ink);
    line-height:1.3;
  }
  button.q .chev{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--birch);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    font-weight:700;
    color:var(--pine);
    transition:transform .18s ease;
  }
  .item.open button.q .chev{transform:rotate(45deg);background:var(--blaze);color:var(--blaze-dark);}

  .answer{
    display:none;
    padding:0 1.15rem 1.3rem;
    font-size:1.05rem;
    color:var(--ink);
  }
  .item.open .answer{display:block;}
  .answer p{margin:0 0 .9rem;}
  .answer ul{margin:0 0 .9rem;padding-left:1.3rem;}
  .answer li{margin-bottom:.5rem;}
  .answer strong{color:var(--pine-dark);}

  .callout{
    background:#EEF3ED;
    border:2px solid #CFE0CC;
    border-radius:10px;
    padding:.8rem 1rem;
    margin:0 0 .9rem;
    font-size:1rem;
  }
  .callout .k{display:block;font-weight:700;color:var(--pine);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.2rem;}

  .linkbtn{
    display:inline-flex;
    align-items:center;
    gap:.4rem;
    background:var(--pine);
    color:#F5F1E4 !important;
    text-decoration:none;
    font-weight:600;
    font-size:.98rem;
    padding:.6rem 1rem;
    border-radius:999px;
    margin:.15rem .4rem .15rem 0;
  }
  .linkbtn:after{content:"→";}
  .linkbtn.alt{background:var(--rust);}

  footer{
    padding:1.5rem 1.25rem 0;
    color:var(--slate);
    font-size:.9rem;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============================================================
       STATE HEADER — edit the mascot SVG, date badge, and text below.
       ============================================================ -->
  <header class="top">
    <div class="cornerstack">
      <!-- Mascot: swap this SVG for STATENAME's animal/symbol -->
      <svg class="moose" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M18 30 C6 22 4 8 14 4 C22 2 28 14 30 24 C32 16 40 10 46 14 C50 17 47 26 42 32" fill="none" stroke="#E8A33D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M102 30 C114 22 116 8 106 4 C98 2 92 14 90 24 C88 16 80 10 74 14 C70 17 73 26 78 32" fill="none" stroke="#E8A33D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="60" cy="46" rx="26" ry="22" fill="#F5EFDD" stroke="#123024" stroke-width="3"/>
        <ellipse cx="44" cy="30" rx="7" ry="9" fill="#F5EFDD" stroke="#123024" stroke-width="3"/>
        <ellipse cx="76" cy="30" rx="7" ry="9" fill="#F5EFDD" stroke="#123024" stroke-width="3"/>
        <ellipse cx="60" cy="62" rx="19" ry="15" fill="#E7DCC0" stroke="#123024" stroke-width="3"/>
        <circle cx="52" cy="41" r="3" fill="#123024"/>
        <circle cx="68" cy="41" r="3" fill="#123024"/>
        <circle cx="53" cy="64" r="2.5" fill="#123024"/>
        <circle cx="67" cy="64" r="2.5" fill="#123024"/>
      </svg>
      <div class="datebadge">
        <p class="label">Election</p>
        <p class="when">[DATE]<br>2026</p>
      </div>
    </div>
    <div class="headtext">
      <p class="eyebrow">STATENAME voter guide</p>
      <h1>How to make sure your vote counts</h1>
      <p>Everything you need to register, vote by mail, or vote in person — tap a question to see the answer.</p>
    </div>
  </header>

  <!-- ============================================================
       ENGINE — do not need to touch this for a new state.
       Pills below are generated automatically from CATEGORIES
       in the script, in the order they appear there.
       ============================================================ -->
  <nav class="pills" id="pills"></nav>

  <main id="groups"></main>

  <footer id="footerNote"></footer>
</div>

<script>
// ============================================================
// STATE CONTENT — fill in the answers below for STATENAME.
// Questions and categories are fixed; only the "a:" field
// (and its links/sources) should change.
// Everything below (until the "END STATE CONTENT" marker) is
// STATENAME-specific. Nothing after that marker needs to change.
// ============================================================

const FOOTER_NOTE = "[STATENAME footer note — e.g. how close to Election Day polling locations can change, and who to contact for individual questions.]";

const DATA = [
{
  cat: "register", catLabel: "Register to vote",
  items: [
    {
      q: "Are you registered to vote in STATENAME?",
      a: `<p>[How can a STATENAME voter check their registration status? Phone number and/or online lookup tool, plus a link to find their local election office/clerk.]</p>`
    },
    {
      q: "Where do I register to vote?",
      a: `<p>[Where/how to register in STATENAME: online registration, paper card locations (clerk's office, DMV/BMV, social service agencies, mail, registration drives), and what's needed if registering by mail — ID requirements, deadlines, prior-address disclosure rules. Include links: online registration, DMV/BMV branch finder, any registration card policy document.]</p>`
    },
    {
      q: "Who counts as a STATENAME resident?",
      a: `<p>[STATENAME's legal definition of residency for voting purposes — statute citation, how students are treated, link to a residency fact sheet if one exists.]</p>`
    },
    {
      q: "What are the deadlines for registering to vote?",
      a: `<p>[Registration deadlines by method — in person, by mail/third party, online, DMV/BMV, and UOCAVA (military/overseas) — with specific dates for the upcoming election. Link to the full state voter guide.]</p>`
    },
    {
      q: "What if I forgot to register?",
      a: `<p>[Does STATENAME have same-day registration? If not, what are the voter's options if they missed the deadline?]</p>`
    },
  ]
},
{
  cat: "inperson", catLabel: "Vote in person",
  items: [
    {
      q: "Where do I vote on Election Day?",
      a: `<p>[Link to STATENAME's polling place lookup tool. Note poll closing time, and how close to Election Day polling locations can still change.]</p>`
    },
    {
      q: "What kind of ID must I bring to the polls?",
      a: `<p>[STATENAME's accepted forms of ID to register and/or vote in person — photo ID list, non-photo ID/document alternatives, student ID rules, etc. Link to the relevant statute or official ID requirements page.]</p>`
    },
    {
      q: "What if I don't have the ID when I try to register?",
      a: `<p>[STATENAME's fallback options for registering without standard ID — sworn statements, alternate documents, provisions for voters experiencing homelessness, and any difference between online vs. paper registration in this situation. Link to a source like Vote411 or the state election office.]</p>`
    },
  ]
},
{
  cat: "mail", catLabel: "Vote by mail",
  items: [
    {
      q: "What if I want to vote by mail? (Absentee ballots)",
      a: `<p>[How to request an absentee/mail ballot in STATENAME — eligibility (no-excuse vs. excuse-required), request methods (phone, mail, online), request window and deadline, witness/notarization requirements if any, and ongoing/permanent absentee status if offered. Link to the ballot request tool and the full absentee voting guide.]</p>`
    },
    {
      q: "What do I do with my ballot?",
      a: `<p>[Return options and deadlines — mail-in cutoff (postmark vs. received-by rules), in-person drop-off, drop boxes, and returning a ballot on behalf of a family member. Link to a clerk/election-office finder.]</p>`
    },
    {
      q: "What happens if I try to vote in person after I've returned my absentee ballot?",
      a: `<p>[STATENAME's process for reconciling absentee and in-person votes — how the state prevents/handles double voting.]</p>`
    },
    {
      q: "How do I know my mailed-in ballot reached the right location?",
      a: `<p>[Does STATENAME have a ballot tracking tool? Link to it, and note when/if it becomes available for this election cycle.]</p>`
    },
  ]
},
{
  cat: "accessible", catLabel: "Accessible ballots",
  items: [
    {
      q: "How do I get an accessible absentee ballot?",
      a: `<p>[STATENAME's accessible/electronic ballot option for voters with print disabilities — how to request it, self-certification process, confirmation steps. Link to the official accessible voting page.]</p>`
    },
  ]
},
{
  cat: "overseas", catLabel: "Military & overseas voters",
  items: [
    {
      q: "I'm in the service or living overseas — what do I do?",
      a: `<p>[STATENAME's UOCAVA registration/ballot request process — online option, Federal Post Card Application, and how/where to submit it (email, fax, mail address). Include the actual submission contacts.]</p>`
    },
  ]
},
{
  cat: "volunteer", catLabel: "For volunteers",
  items: [
    {
      q: "Just for volunteers: voter registration cards & poll working",
      a: `<p>[Rules for volunteers running registration drives in STATENAME — card specs if self-printed, submission deadlines/process, and how to sign up as a poll worker. Link to the relevant forms and poll-worker recruitment page.]</p>`
    },
    {
      q: "Still more questions?",
      a: `<p>[General help resources — e.g. Vote411 link and/or a state-specific voter helpline number.]</p>`
    },
  ]
},
];

// ============================================================
// END STATE CONTENT
// ============================================================

const groupsEl = document.getElementById('groups');
document.getElementById('footerNote').textContent = FOOTER_NOTE;

function render(filter){
  groupsEl.innerHTML = '';
  DATA.forEach(group => {
    if(filter !== 'all' && filter !== group.cat) return;
    const section = document.createElement('section');
    section.className = 'group';
    const h2 = document.createElement('h2');
    h2.textContent = group.catLabel;
    section.appendChild(h2);
    group.items.forEach((it, idx) => {
      const item = document.createElement('div');
      item.className = 'item';
      const btn = document.createElement('button');
      btn.className = 'q';
      btn.innerHTML = `<span class="qtext">${it.q}</span><span class="chev">+</span>`;
      const ans = document.createElement('div');
      ans.className = 'answer';
      ans.innerHTML = it.a;
      btn.addEventListener('click', () => {
        item.classList.toggle('open');
      });
      item.appendChild(btn);
      item.appendChild(ans);
      section.appendChild(item);
    });
    groupsEl.appendChild(section);
  });
}

// Build the pill nav from DATA, so categories only need to be defined once.
const pillsEl = document.getElementById('pills');
const allBtn = document.createElement('button');
allBtn.className = 'active';
allBtn.dataset.cat = 'all';
allBtn.textContent = 'All';
pillsEl.appendChild(allBtn);
DATA.forEach(group => {
  const b = document.createElement('button');
  b.dataset.cat = group.cat;
  b.textContent = group.catLabel;
  pillsEl.appendChild(b);
});

pillsEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  document.querySelectorAll('#pills button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  render(b.dataset.cat);
});

render('all');
</script>
</body>
</html>
