<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Make Sure Your Vote Counts in Maine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     STATE THEME — swap these per state if you want a different
     look (each state's flag/colors are a natural starting point).
     Keep the variable NAMES the same; only change the hex values.
     ============================================================ */
  :root{
    --pine:#1F4E3D;
    --pine-dark:#123024;
    --birch:#FBF7ED;
    --birch-card:#FFFFFF;
    --blaze:#E8A33D;
    --blaze-dark:#8A5710;
    --rust:#B5502E;
    --ink:#1C2620;
    --slate:#5B6B62;
    --line:#DDD5C2;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--birch);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:19px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--pine);}
  .wrap{max-width:640px;margin:0 auto;padding:0 0 4rem;}

  header.top{
    background:var(--pine);
    color:#F5F1E4;
    padding:1.6rem 1.25rem 1.9rem;
    border-bottom:6px solid var(--blaze);
    position:relative;
  }
  header.top .headtext{
    max-width:calc(100% - 108px);
  }
  .cornerstack{
    position:absolute;
    top:1.2rem;
    right:1.1rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.5rem;
  }
  .cornerstack .moose{
    width:82px;
    height:69px;
    display:block;
  }
  header.top .eyebrow{
    font-size:.85rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--blaze);
    font-weight:700;
    margin:0 0 .35rem;
  }
  header.top h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:1.8rem;
    line-height:1.14;
    margin:0 0 .6rem;
  }
  header.top p{
    margin:0;
    font-size:1.05rem;
    color:#E4DEC9;
    max-width:34ch;
  }

  .datebadge{
    background:var(--blaze);
    border-radius:12px;
    padding:.5rem .65rem;
    text-align:center;
    box-shadow:0 4px 0 rgba(0,0,0,0.08);
    min-width:74px;
  }
  .datebadge .label{
    font-size:.6rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--blaze-dark);
    margin:0 0 .2rem;
  }
  .datebadge .when{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:.95rem;
    line-height:1.15;
    color:#3A2205;
    margin:0;
  }

  nav.pills{
    display:flex;
    flex-wrap:wrap;
    gap:.55rem;
    padding:1.2rem 1rem 1.2rem;
    justify-content:center;
  }
  nav.pills button{
    flex:0 0 auto;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:.88rem;
    white-space:nowrap;
    color:var(--pine);
    background:#fff;
    border:2px solid var(--line);
    border-radius:999px;
    padding:.55rem 1rem;
    cursor:pointer;
  }
  nav.pills button.active{
    background:var(--pine);
    border-color:var(--pine);
    color:#F5F1E4;
  }

  .group{padding:0 1rem;margin-bottom:1.6rem;}
  .group h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.15rem;
    color:var(--pine);
    margin:0 0 .7rem;
    padding-left:.15rem;
  }

  .item{
    background:var(--birch-card);
    border:2px solid var(--line);
    border-left:8px solid var(--pine);
    border-radius:12px;
    margin-bottom:.85rem;
    overflow:hidden;
  }
  .item.open{border-left-color:var(--blaze);}

  button.q{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:1.05rem 1rem;
    display:flex;
    align-items:center;
    gap:.8rem;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button.q .qtext{
    flex:1;
    font-size:1.15rem;
    font-weight:700;
    color:var(--ink);
    line-height:1.3;
  }
  button.q .chev{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--birch);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    font-weight:700;
    color:var(--pine);
    transition:transform .18s ease;
  }
  .item.open button.q .chev{transform:rotate(45deg);background:var(--blaze);color:var(--blaze-dark);}

  .answer{
    display:none;
    padding:0 1.15rem 1.3rem;
    font-size:1.05rem;
    color:var(--ink);
  }
  .item.open .answer{display:block;}
  .answer p{margin:0 0 .9rem;}
  .answer ul{margin:0 0 .9rem;padding-left:1.3rem;}
  .answer li{margin-bottom:.5rem;}
  .answer strong{color:var(--pine-dark);}

  .callout{
    background:#EEF3ED;
    border:2px solid #CFE0CC;
    border-radius:10px;
    padding:.8rem 1rem;
    margin:0 0 .9rem;
    font-size:1rem;
  }
  .callout .k{display:block;font-weight:700;color:var(--pine);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.2rem;}

  .linkbtn{
    display:inline-flex;
    align-items:center;
    gap:.4rem;
    background:var(--pine);
    color:#F5F1E4 !important;
    text-decoration:none;
    font-weight:600;
    font-size:.98rem;
    padding:.6rem 1rem;
    border-radius:999px;
    margin:.15rem .4rem .15rem 0;
  }
  .linkbtn:after{content:"→";}
  .linkbtn.alt{background:var(--rust);}

  footer{
    padding:1.5rem 1.25rem 0;
    color:var(--slate);
    font-size:.9rem;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============================================================
       STATE HEADER — edit the mascot SVG, date badge, and text below.

  <header class="top">
    <div class="cornerstack">
      <!-- Mascot: swap this SVG for the new state's animal/symbol -->
      <svg class="moose" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

  <!-- ============================================================

  <main id="groups"></main>

<script>
// ============================================================
// STATE CONTENT — replace everything in this block for a new state.
// Everything below (until the "END STATE CONTENT" marker) is
// specific to Maine. Nothing after that marker needs to change.
// ============================================================

const FOOTER_NOTE = "Voting place locations and hours can change up to 10 days before an election — check back close to Election Day. Questions about your own registration or ballot? Your municipal clerk's office is the fastest answer.";

const DATA = [
{
  cat: "register", catLabel: "Register to vote",
  items: [
    {
      q: "Are you registered to vote in Maine?",
      a: `<p>There's no online way to check. Call the Maine Division of Elections and a real person will answer.</p>
      <div class="callout"><span class="k">Call</span>207-624-7650</div>
      <p>Or find your municipal clerk's office and call them directly.</p>
      <a class="linkbtn" href="https://www.maine.gov/sos/elections-voting/find-a-municipal-clerk-or-registrar" target="_blank" rel="noopener">Find your municipal clerk</a>`
    },
    {
      q: "Where do I register to vote?",
      a: `<p>You can register online, or fill out a paper voter registration card at:</p>
      <ul>
        <li>Your municipal clerk or registrar's office</li>
        <li>Any Bureau of Motor Vehicles (BMV) branch</li>
        <li>Most state and federal social service agencies</li>
        <li>By mail, or through a voter registration drive</li>
      </ul>
      <a class="linkbtn" href="https://registertovote.sos.maine.gov/OnlineVoterRegistration/Registration" target="_blank" rel="noopener">Register online</a>
      <a class="linkbtn alt" href="https://www.maine.gov/sos/bmv/visit-your-bmv-branch/find-your-local-branch#branch" target="_blank" rel="noopener">Find a BMV branch</a>
      <p style="margin-top:.9rem;"><strong>Registering by mail?</strong> New voters must include a copy of an ID document — a Maine driver's license or other valid photo ID, a current utility bill, a bank statement, a paycheck stub, or another government document showing your current name and address.</p>
      <ul>
        <li>Mail your card and ID copy so it arrives at least 21 days before the election. Because mail can be slow, aim to send it before Sept. 30.</li>
        <li>You'll need to list any address where you were previously registered (in or out of Maine), unless this is your first time registering.</li>
      </ul>
      <a class="linkbtn" href="https://www.maine.gov/sos/sites/maine.gov.sos/files/content/assets/Voter-20Registration-20Card-20Policy.pdf" target="_blank" rel="noopener">Registration card policy</a>`
    },
    {
      q: "Who counts as a Maine resident?",
      a: `<p>Maine election law (Title 21-A, section 112(1)) defines residence as the place where you've established a fixed and principal home, and where you intend to return whenever you're away. Residence is something you <strong>establish</strong>, not something you simply choose.</p>
      <p>Students must meet the same standard: you need to actually declare Maine as your residence, not just the place where you go to school.</p>
      <a class="linkbtn" href="https://www.maine.gov/sos/elections-voting/registering-to-vote/maine-voting-residence-fact-sheet" target="_blank" rel="noopener">Residency fact sheet</a>`
    },
    {
      q: "What are the deadlines for registering to vote?",
      a: `<ul>
        <li><strong>In person:</strong> Any time up to the close of the polls on Election Day.</li>
        <li><strong>By mail or through a 3rd party:</strong> Received by your town or city at least 21 days before Election Day — <strong>October 13, 2026</strong> for the November general.</li>
        <li><strong>Online:</strong> By 5 PM on the 21st day before Election Day — same date as above.</li>
        <li><strong>Through the BMV:</strong> By the 7th day before Election Day — <strong>October 27, 2026</strong>.</li>
        <li><strong>UOCAVA voters (military & overseas), by mail or electronically:</strong> By noon the day before Election Day — <strong>November 2, 2026</strong>.</li>

      <a class="linkbtn" href="https://www.maine.gov/sos/elections-voting/state-of-maine-voter-guide" target="_blank" rel="noopener">Full state voter guide</a>`
    },
    {
      q: "What if I forgot to register?",
      a: `<p>Maine has same-day voter registration — just fill out your card at the polls on Election Day. Once you're registered in Maine, it's good for life, unless you change your name or address.</p>`
    },
  ]
},
{
  cat: "inperson", catLabel: "Vote in person",
  items: [
    {
      q: "Where do I vote on Election Day?",
      a: `<p>Your polling place is based on your address. All polls close by 8 PM. Voting locations can be updated by municipalities up to <strong>10 days</strong> before the election, so check back close to Election Day for the final location.</p>
      <a class="linkbtn" href="https://www.maine.gov/portal/government/edemocracy/voter_lookup.php" target="_blank" rel="noopener">Find your polling place</a>

        <li>A government-issued photo ID — like a Maine driver's license, state ID, U.S. passport, military ID, or tribal ID</li>

        <li>Providing a sworn written statement (under oath) describing your place of residence</li>

{
  cat: "mail", catLabel: "Vote by mail",
  items: [
    {
      q: "What if I want to vote by mail? (Absentee ballots)",
      a: `<p>Any registered Maine voter can request an absentee ballot by phone (call your town office), by mail, or online. The ballot is mailed to your home. You can also request one on behalf of an immediate family member — your municipal clerk can tell you exactly who counts as immediate family.</p>
      <p>Ballots obtained by you or an immediate family member don't need a witness, unless the voter needs help reading or marking it.</p>
      <a class="linkbtn" href="https://absenteeballotrequest.sos.maine.gov/" target="_blank" rel="noopener">Request an absentee ballot</a>
      <p style="margin-top:.9rem;">You can request a ballot as early as 2 months before Election Day, and as late as the 3rd business day before the election (barring special circumstances).</p>
      <ul>
        <li>The Post Office will <strong>not</strong> forward a ballot — you must explicitly request it be sent somewhere else.</li>
        <li>Clerk's offices start mailing ballots out 1 month before the election.</li>

      <a class="linkbtn alt" href="https://www.maine.gov/sos/sites/maine.gov.sos/files/inline-files/3%20Ongoing%20AbsenteeStatusApp%20fillable%20pdf%20FINAL.pdf" target="_blank" rel="noopener">Ongoing absentee status form</a>

      a: `<p>To be counted, your absentee ballot must be <strong>received</strong> — not just postmarked — by your municipal clerk by 8:00 PM on Election Day.</p>
      <p>You can hand it in at your town registrar or clerk's office, or mail it. If you're mailing it:</p>

      </ul>

      <p>Cutting it closer than that? Drop your ballot off in person, or at an absentee ballot drop box at your municipal office if one is available, by 8 PM on Election Day — or plan to just vote in person instead.</p>
      <p>You can also drop off a ballot for a family member or neighbor — they'll need to sign it, confirming you have the right to drop it off for them.</p>
      <a class="linkbtn" href="https://www.maine.gov/sos/elections-voting/find-a-municipal-clerk-or-registrar" target="_blank" rel="noopener">Find your clerk's office</a>`
    },
    {
      q: "What happens if I try to vote in person after I've returned my absentee ballot?",
      a: `<p>Once your municipal clerk receives and accepts your absentee ballot, they mark you as "AV" (absentee voter) in the voter system. When the incoming voter list prints just before Election Day, your name is already checked off — so you won't be able to get a ballot if you show up to vote in person.</p>
      <p>On Election Day itself, absentee ballots are still coming in and get processed in batches, with each polling place updated as new ones arrive. So if you've already voted absentee and try to vote in person, it won't go through — and the reverse is true too: if you vote in person before your absentee ballot arrives that day, the absentee ballot is rejected.</p>`
    },
    {
      q: "How do I know my mailed-in ballot reached the right location?",
      a: `<p>Starting <strong>August 3, 2026</strong>, you'll be able to track your absentee ballot online. The tracker shows the date your application was accepted, the date your ballot was mailed out, and the date your clerk received it back.</p>
      <p>The tracker isn't instant — it updates only after your municipal clerk enters the information. If you're ever concerned about your ballot, contact your clerk directly.</p>
      <a class="linkbtn" href="https://absenteeballotrequest.sos.maine.gov/" target="_blank" rel="noopener">Track your ballot (live Aug 3, 2026)</a>`

      <a class="linkbtn" href="https://www.maine.gov/sos/elections-voting/accessible-voting" target="_blank" rel="noopener">Accessible voting options</a>`
    },
  ]
},
{
  cat: "overseas", catLabel: "Military & overseas voters",
  items: [
    {
      q: "I'm in the service or living overseas — what do I do?",
      a: `<p>You have two ways to register and request your ballot:</p>
      <a class="linkbtn" href="https://registertovote.sos.maine.gov/OnlineUOCAVARegistration/Registration" target="_blank" rel="noopener">Register online</a>
      <p style="margin-top:.9rem;">Or fill out the Federal Post Card Application — it registers you to vote and requests an absentee ballot for every election within 18 months of submitting it. You can type your info into the form, then print and sign it.</p>
      <a class="linkbtn alt" href="https://www.maine.gov/sos/sites/maine.gov.sos/files/content/assets/fedpostcardapp.pdf" target="_blank" rel="noopener">Federal Post Card Application (PDF)</a>
      <p style="margin-top:.9rem;"><strong>Three ways to submit the completed, signed form:</strong></p>
      <ul>
        <li>Email a scanned copy to <strong>UOCAVA.CEC@maine.gov</strong></li>
        <li>Fax it toll-free (from the U.S.) to <strong>1-877-443-1302</strong></li>
        <li>Mail it to: Bureau of Corporations, Elections, and Commissions — Elections Division, 184 State House Station, Augusta, ME 04333-0184</li>
      </ul>`
    },
  ]
},
{
  cat: "volunteer", catLabel: "For volunteers",
  items: [
    {
      q: "Just for volunteers: voter registration cards & poll working",
      a: `<p>Hard-copy voter registration cards supplied by the Secretary of State for registration drives are 4" x 6" and green. An electronic, print-ready version is also available as a PDF with both front and back — if you print it yourself, both sides need to go on a single sheet of 8½" x 11" paper. If you print your own cards from scratch, they must be double-sided on 4" x 6" green cardstock.</p>
      <a class="linkbtn" href="https://www.maine.gov/sos/sites/maine.gov.sos/files/content/assets/vrregreq124.pdf" target="_blank" rel="noopener">Printable registration card (PDF)</a>
      <p style="margin-top:.9rem;">Completed cards can be submitted directly to the Secretary of State, but must arrive at least 30 days before the election to leave time to route them to municipalities. It's faster and more efficient to submit cards straight to the appropriate municipal registrar instead.</p>
      <p style="margin-top:.9rem;"><strong>Want to work the polls?</strong></p>
      <a class="linkbtn" href="https://mtcca.org/About/Maine-Election-Worker-Recruitment" target="_blank" rel="noopener">Volunteer to be a poll worker</a>`
    },
    {
      q: "Still more questions?",
      a: `<p>Check out Vote411, or call the Voter ID Helpline.</p>
      <a class="linkbtn" href="https://www.vote411.org/maine" target="_blank" rel="noopener">Vote411: Maine</a>
      <div class="callout"><span class="k">Voter ID Helpline</span>844-338-8743</div>`
    },
  ]
},
];

// ============================================================
// END STATE CONTENT
// ============================================================

const groupsEl = document.getElementById('groups');
document.getElementById('footerNote').textContent = FOOTER_NOTE;

function render(filter){
  groupsEl.innerHTML = '';
  DATA.forEach(group => {
    if(filter !== 'all' && filter !== group.cat) return;
    const section = document.createElement('section');
    section.className = 'group';
    const h2 = document.createElement('h2');
    h2.textContent = group.catLabel;
    section.appendChild(h2);
    group.items.forEach((it, idx) => {
      const item = document.createElement('div');
      item.className = 'item';
      const btn = document.createElement('button');
      btn.className = 'q';
      btn.innerHTML = `<span class="qtext">${it.q}</span><span class="chev">+</span>`;
      const ans = document.createElement('div');
      ans.className = 'answer';
      ans.innerHTML = it.a;
      btn.addEventListener('click', () => {
        item.classList.toggle('open');
      });
      item.appendChild(btn);
      item.appendChild(ans);
      section.appendChild(item);
    });
    groupsEl.appendChild(section);
  });
}

// Build the pill nav from DATA, so categories only need to be defined once.
const pillsEl = document.getElementById('pills');
const allBtn = document.createElement('button');
allBtn.className = 'active';
allBtn.dataset.cat = 'all';
allBtn.textContent = 'All';
pillsEl.appendChild(allBtn);
DATA.forEach(group => {
  const b = document.createElement('button');
  b.dataset.cat = group.cat;
  b.textContent = group.catLabel;
  pillsEl.appendChild(b);
});

pillsEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  document.querySelectorAll('#pills button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  render(b.dataset.cat);
});

render('all');
</script>
</body>
</html>
